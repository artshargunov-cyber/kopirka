name: Build Windows Installer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Read version
      id: version
      run: |
        $version = python -c "from utils import VERSION; print(VERSION)"
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name Kopirka `
          --add-data "assets;assets" `
          --add-data "updater.py;." `
          --icon "assets/icon.ico" `
          main.py

    - name: Install Inno Setup
      run: |
        choco install innosetup -y --no-progress

    - name: Update version in installer script
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        (Get-Content installer.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content installer.iss

    - name: Build Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kopirka-Windows-Installer
        path: installer_output/*.exe

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $tag = "v$version"
        $installer = Get-ChildItem installer_output/*.exe | Select-Object -First 1
        
        # Создаём релиз (если уже существует — пропускаем)
        gh release create $tag `
          --title "Копирка v$version" `
          --notes "## Что нового в v$version\n\nСкачайте `KopirkaSetup-$version.exe` и запустите установщик.\nСписок класса сохраняется при обновлении." `
          --latest 2>$null || true
        
        # Загружаем установщик как ассет
        gh release upload $tag $installer.FullName --clobber
